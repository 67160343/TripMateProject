<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>TripMate - ตั้งรหัสผ่านใหม่</title>
<style>
  body { font-family: sans-serif; background: #f6f8fc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 12px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
  input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #6c63ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <h2>ตั้งรหัสผ่านใหม่</h2>
  <input type="password" id="newPassword" placeholder="รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)" minlength="8">
  <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่านใหม่" minlength="8">
  <button id="resetBtn">ยืนยันรหัสผ่านใหม่</button>
  <p id="msg" style="color: red; font-size: 14px; text-align: center;"></p>
</div>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  if(!token) { document.getElementById('msg').innerText = "ไม่พบ Token สำหรับรีเซ็ตรหัสผ่าน"; document.getElementById('resetBtn').disabled = true; }

  document.getElementById('resetBtn').onclick = async () => {
    const pw = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if(pw !== confirm) return document.getElementById('msg').innerText = "รหัสผ่านไม่ตรงกัน";
    
    try {
      const res = await fetch('http://localhost:3000/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: pw })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.message || 'Error');
      alert('เปลี่ยนรหัสผ่านสำเร็จ');
      window.location.href = 'tripmate_frontend_api.html'; // กลับไปหน้าล็อกอิน
    } catch(e) {
      document.getElementById('msg').innerText = e.message;
    }
  };
</script>
</body>
</html>
